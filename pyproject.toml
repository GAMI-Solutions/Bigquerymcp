[project]
name = "bigquery-mcp"
version = "0.1.0"
description = "A secure, Python-native MCP server for querying, analyzing, and managing Google BigQuery — with cost guardrails, PII protection, and audit logging built in."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gami Solutions" }]
dependencies = [
    "mcp>=1.2.0",
    "google-cloud-bigquery>=3.25.0",
    "google-auth>=2.34.0",
    "pydantic>=2.7.0",
    "db-dtypes>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]

[project.scripts]
bigquery-mcp = "bigquery_mcp.server:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
